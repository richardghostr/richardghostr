    <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
  </text>
  <text x="500" y="115" text-anchor="middle" fill="#cbd5e1"
        font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18">
